<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>คุณเป็นเกย์มั้ย?</title>
  <style>
    :root { --radius: 18px; }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Thai", "Noto Sans", sans-serif;
      background: #0f0f12;
      color: #fff;
    }
    .wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(680px, 92vw);
      background: #16161a;
      border: 1px solid #2a2a31;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      padding: 28px 28px 36px;
      position: relative;
      overflow: hidden;
    }
    .title {
      font-size: clamp(22px, 3.5vw, 34px);
      line-height: 1.15;
      text-align: center;
      margin: 10px 0 20px;
    }
    .playground {
      position: relative;
      height: 220px;
      border-radius: calc(var(--radius) - 6px);
      background: radial-gradient(1200px 400px at 50% -200px, #1d1d24, #131318);
      outline: 1px dashed #2b2b33;
      outline-offset: -8px;
      overflow: hidden;
    }
    .buttons {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none; /* so the "ไม่" can float freely */
    }
    .btn {
      pointer-events: auto;
      user-select: none;
      border: 0;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 999px;
      background: #2b2b33;
      color: #fff;
      cursor: pointer;
      transition: transform .08s ease, box-shadow .2s ease, background .2s ease;
      box-shadow: 0 6px 16px rgba(0,0,0,.25);
      font-size: clamp(14px, 2.2vw, 16px);
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn.primary { background: #6c5ce7; }
    .btn.primary:hover { background: #7a6df0; }
    /* The runaway button */
    #noBtn {
      position: absolute;
      left: 20%;
      top: 58%;
      transform: translate(-50%, -50%);
      background: #ff4757;
    }
    #yesBtn {
      position: relative;
      z-index: 1;
    }

    .result {
      margin-top: 20px;
      display: none;
      text-align: center;
    }
    .flag {
      margin: 10px auto 0;
      width: min(460px, 80%);
      max-width: 100%;
      display: block;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));
    }
    .sub {
      color: #c9c9d1;
      font-size: 14px;
      margin-top: 8px;
    }
    /* small hint badge */
    .hint {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #22222a;
      border: 1px solid #2a2a31;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      color: #bbb;
      opacity: .9;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="group" aria-labelledby="q">
      <div class="hint">ลองกด “ไม่” ดูสิ 😏</div>
      <h1 id="q" class="title">คุณเป็นเกย์มั้ย?</h1>

      <div class="playground" id="area">
        <div class="buttons">
          <button id="yesBtn" class="btn primary" type="button" aria-label="ใช่">ใช่</button>
          <button id="noBtn" class="btn" type="button" aria-label="ไม่">ไม่</button>
        </div>
      </div>

      <div id="result" class="result" aria-live="polite" aria-atomic="true">
        <!-- LGBTQ flag as inline SVG -->
        <svg class="flag" viewBox="0 0 600 360" role="img" aria-label="ธง LGBTQ">
          <title>ธง LGBTQ</title>
          <rect width="600" height="60" y="0"   fill="#e40303"></rect>   <!-- red -->
          <rect width="600" height="60" y="60"  fill="#ff8c00"></rect>   <!-- orange -->
          <rect width="600" height="60" y="120" fill="#ffed00"></rect>   <!-- yellow -->
          <rect width="600" height="60" y="180" fill="#008026"></rect>   <!-- green -->
          <rect width="600" height="60" y="240" fill="#004dff"></rect>   <!-- blue -->
          <rect width="600" height="60" y="300" fill="#750787"></rect>   <!-- violet -->
        </svg>
        <div class="sub">รักคือรัก 🏳️‍🌈</div>
      </div>
    </div>
  </div>

  <script>
    const area   = document.getElementById('area');
    const noBtn  = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const result = document.getElementById('result');

    // Utility: place the "ไม่" button at a random safe position inside the playground
    function moveNoButton() {
      const bounds = area.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();
      const margin = 10;

      // Available space (keep the whole button inside)
      const maxX = bounds.width  - btnRect.width  - margin;
      const maxY = bounds.height - btnRect.height - margin;

      // Random position with a little bias away from center so it feels like "running"
      let x = Math.random() * maxX + margin/2;
      let y = Math.random() * maxY + margin/2;

      // Apply
      noBtn.style.left = x + 'px';
      noBtn.style.top  = y + 'px';
      noBtn.style.transform = 'translate(0,0)';
    }

    // Runaway behaviors: hover, focus, click, and getting too close with the pointer
    function flee() { moveNoButton(); }

    noBtn.addEventListener('mouseenter', flee);
    noBtn.addEventListener('focus', flee);
    noBtn.addEventListener('click', (e) => { e.preventDefault(); flee(); });

    // Extra: if the pointer comes within a radius, make it flee
    area.addEventListener('pointermove', (e) => {
      const r = 90; // flee radius
      const b = noBtn.getBoundingClientRect();
      const dX = e.clientX - (b.left + b.width/2);
      const dY = e.clientY - (b.top  + b.height/2);
      const dist = Math.hypot(dX, dY);
      if (dist < r) moveNoButton();
    });

    // On resize, keep it inside
    window.addEventListener('resize', moveNoButton);
    // On load, position it once
    window.requestAnimationFrame(moveNoButton);

    // YES: reveal the flag
    yesBtn.addEventListener('click', () => {
      result.style.display = 'block';
      // a tiny bounce
      result.animate([
        { transform: 'scale(.92)', opacity: 0 },
        { transform: 'scale(1.02)', opacity: 1 },
        { transform: 'scale(1)', opacity: 1 }
      ], { duration: 400, easing: 'cubic-bezier(.2,.8,.2,1)' });
    });
  </script>
</body>
</html>
